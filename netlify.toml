[build]
  command = "echo 'Static site + serverless API - no build step required'"
  functions = "functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/admin-dashboard"
  to = "/admin-dashboard.html"
  status = 200

[[redirects]]
  from = "/admin_dashboard"
  to = "/admin-dashboard.html"
  status = 200

[[redirects]]
  from = "/sitemap-custom.xml"
  to = "/.netlify/functions/sitemap-custom"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
